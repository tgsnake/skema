name: Publishing Github Release
on:
  repository_dispatch:
    types: [update_version]
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: |
          yarn config set enableImmutableInstalls false
          yarn install --frozen-lockfile
      - name: Update version
        run: |
          npm version minor --no-git-tag-version
          yarn build:jsr
      - name: Build package
        run: |
          yarn build
          yarn prettier
          npm pack
      - name: Push changes
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          git config user.email github-actions[bot]@users.noreply.github.com
          git config user.name github-actions[bot]
          git add package.json jsr.json
          git commit -m "chore: Bump version to $PACKAGE_VERSION" || echo "No changes to commit"
          git push origin master || echo "No changes to push"
      - name: Get version from package.json
        id: get_version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.get_version.outputs.PACKAGE_VERSION }}
          name: Release v${{ steps.get_version.outputs.PACKAGE_VERSION }}
          generate_release_notes: true
          files: ./*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Cleanup
        run: |
          rm -f *.tgz
          echo "Cleanup completed"
        if: always()
      - name: Final message
        run: echo "Workflow completed"
        if: always()
